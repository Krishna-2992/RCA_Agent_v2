  - id: PC-11
    title: "ASN / EDI / file hand-off logic gaps"
    status: draft
    draft_confidence: low
    system: batch
    applications: [Shipping, Batch]
    symptoms:
      - "a new facility / dock code was added; the ASN header needs to change to send EDI"
      - "ASN was not created for a load that was sent to the mainframe"
      - "investigate which supplier code the ASN process uses"
      - "mainframe job has not produced SS0001.rel for the Tidal job to process EDI"
    signals:
      files: [SS0001.REL]
      programs: [F8RH7910, F8RHC071]
      datasets: [WRK.F8RH.P1F80148, ACT.F8RH.P1F80250]
      phrases: [ASN, EDI, dock code, facility code, supplier code, load]
    root_cause: >-
      The ASN process logic does not cover a new case, such as a new facility or dock code, so
      the ASN or EDI output is wrong or missing. It needs developer analysis.
    steps:
      - text: "Collect the load or ASN number, facility and dock code, and the date it happened."
        source: ticket
        refs: [SCTASK4881141, INC10183770]
      - text: "Escalate to development. A past fix added the missing facility code conversion (R6 to 47) in quickjob F8RHC071, used by the ASN process F8RH7910."
        source: ticket
        refs: [INC10183770]
    verify: "The ASN or EDI file is produced with the right header for the load."
    preventive:
      - "Add new facility and dock codes to the ASN conversion logic when they are created (needs SME input)."
    escalation: code_change
    evidence:
      incidents: [INC10183770]
      service_requests: [SCTASK4897775, SCTASK4881141, SCTASK4821596, SCTASK4815228]

