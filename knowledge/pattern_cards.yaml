  - id: PC-15
    title: "No fault found / transient / not a COBOL issue"
    status: draft
    draft_confidence: medium
    system: any
    applications: []
    symptoms:
      - "LMS has completely frozen on all systems; we cannot exit or make transactions"
      - "an error message that turned out not to be a COBOL issue"
      - "equipment will not load, operators down"
    signals:
      phrases: [frozen, not reproducible, working fine, fixed itself, no issue]
    root_cause: >-
      No fault found: the condition cleared by itself, could not be reproduced, or was not a
      COBOL application issue.
    steps:
      - text: "Ask for the exact error text or a screenshot, and whether other users are affected."
        source: ticket
        refs: [INC9998727]
      - text: "If it cleared by itself or cannot be reproduced, close it as not reproducible."
        source: ticket
        refs: [INC10183373, INC9998727]
      - text: "If it recurs or names a file or error number, re-route it to PC-01, PC-02 or PC-03."
        source: sme
        needs_sme: "Confirm this triage rule."
    verify: "The user confirms normal operation."
    preventive: []
    escalation: not_reproducible
    evidence:
      incidents: [INC10183373, INC10181601, INC9998727]
